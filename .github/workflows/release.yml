# Costruisce l'installer per Windows e lo pubblica come release quando arriva un tag v*.
# electron-updater legge quella release per aggiornare le installazioni degli utenti.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La release va creata PRIMA: se la crea electron-builder, i caricamenti in parallelo
      # ne aprono più di una e i file finiscono sparsi fra bozze diverse.
      - name: Crea la release
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OpenHowl ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Costruisci e carica l'installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
